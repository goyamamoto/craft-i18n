name: Language packs

# Downloads every file in language-data/manifest.toml, checks its sha256 and size, loads every
# pack through craft-proof against its check words, and (on a tag or a manual release run)
# publishes one <locale>.tar.zst per published pack plus index.json as release assets.
# A release is never modified: an existing name is refused; a new one is created as a draft,
# filled, then published. Format: docs/language-data-format.md.

on:
  push:
    tags: ["language-packs-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release to publish (language-packs-<n>); leave empty to only verify"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1" # weekly: upstream pins still download and match

permissions:
  contents: read

# One run per release name at a time (scheduled verify runs share one group); never cancelled
# half way, so a publish can't be interrupted by a second run.
concurrency:
  group: language-packs-${{ github.ref_type == 'tag' && github.ref_name || inputs.release || 'verify' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CRAFT_I18N_FETCH: "1"
      CRAFT_I18N_CACHE: ${{ github.workspace }}/target/language-data-cache
    outputs:
      release: ${{ steps.rel.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/language-data-cache
          key: language-data-${{ hashFiles('language-data/manifest.toml') }}
          restore-keys: language-data-
      - name: release name
        id: rel
        env:
          INPUT: ${{ github.event.inputs.release }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then name="$GITHUB_REF_NAME"; else name="$INPUT"; fi
          if [[ -n "$name" ]]; then
            # [[ =~ ]] matches the whole string, so a newline in the input can't sneak through.
            if ! [[ "$name" =~ ^language-packs-[0-9]+$ ]]; then
              echo "release must be language-packs-<n>" >&2
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
              echo "a manual release must run on main, not $GITHUB_REF" >&2
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: fetch and verify every file
        run: cargo run --release --locked --bin language-packs -- fetch
      - name: offline checks, sha256 and size, load-and-check per pack
        run: cargo test --release --locked -p craft-i18n-tests --test packs -- --nocapture
      - name: build packs and index.json
        if: steps.rel.outputs.name != ''
        env:
          RELEASE: ${{ steps.rel.outputs.name }}
        run: >
          cargo run --release --locked --bin language-packs -- build
          --out dist --release "$RELEASE" --version "$GITHUB_SHA" --no-download
      - name: keep the built assets
        if: steps.rel.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-packs
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: language-packs
          path: dist
      - name: create a draft release, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: bash
        run: |
          # A manual run creates the tag at $GITHUB_SHA; an existing tag would make --target
          # ignored, so the release could point at other code than the packs were built from.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] &&
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE" >/dev/null 2>&1; then
            echo "tag $RELEASE already exists; pick a new language-packs-<n>" >&2
            exit 1
          fi
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE already exists; releases are never modified: use a new language-packs-<n>" >&2
            exit 1
          fi
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$RELEASE" \
            --notes "Language packs built from $GITHUB_SHA. Format: docs/language-data-format.md."
          gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" dist/*.tar.zst dist/index.json
          gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft=false
